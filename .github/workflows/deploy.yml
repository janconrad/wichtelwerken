name: Deploy to server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  Port ${DEPLOY_PORT:-22}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config

      - name: Deploy project files
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -eu
          rsync -az --delete wp-content/themes/wichtelwerken-child/ "deploy-target:${DEPLOY_PATH%/}/wp-content/themes/wichtelwerken-child/"
          rsync -az wp-content/mu-plugins/wichtelwerken-privacy.php "deploy-target:${DEPLOY_PATH%/}/wp-content/mu-plugins/wichtelwerken-privacy.php"
          rsync -az wp-content/mu-plugins/wichtelwerken-performance-monitoring.php "deploy-target:${DEPLOY_PATH%/}/wp-content/mu-plugins/wichtelwerken-performance-monitoring.php"
          rsync -az wp-content/mu-plugins/wichtelwerken-production-hardening.php "deploy-target:${DEPLOY_PATH%/}/wp-content/mu-plugins/wichtelwerken-production-hardening.php"
          rsync -az wp-content/uploads/ww-import-source/legal/update-legal-pages.php "deploy-target:${DEPLOY_PATH%/}/wp-content/uploads/ww-import-source/legal/update-legal-pages.php"
